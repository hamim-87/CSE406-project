# nginx.conf — NGINX configuration for CSE 406 media server (h1)
#
# Serves video.mp4 with optional rate limiting as a complementary
# application-layer defense against optimistic ACK exploitation.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/cse406/logs/nginx_error.log warn;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/cse406/logs/nginx_access.log;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        root /var/www;

        location /video.mp4 {
            # Application-layer rate limit: caps per-connection throughput.
            # This bounds the damage even if an attacker inflates cwnd,
            # because NGINX will not push data faster than this rate.
            limit_rate 2m;     # 2 MB/s ≈ 16 Mbps (above fair share of 10 Mbps link)

            # Initial burst before rate limiting kicks in (first N bytes unrestricted)
            limit_rate_after 1m;

            add_header X-CSE406-Defense "nginx-rate-limit";
        }

        # Health check endpoint for experiment scripts
        location /health {
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
    }
}
