worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/cse406/logs/nginx_error.log warn;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/cse406/logs/nginx_access.log;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        root /var/www;

        location /video.mp4 {

            add_header X-CSE406-Defense "none";
        }

        location /health {
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
    }
}
