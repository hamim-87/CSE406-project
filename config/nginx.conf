# nginx.conf — NGINX configuration for CSE 406 media server (h1)
#
# Serves video.mp4 with optional rate limiting as a complementary
# application-layer defense against optimistic ACK exploitation.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/cse406/logs/nginx_error.log warn;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /tmp/cse406/logs/nginx_access.log;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        root /var/www;

        location /video.mp4 {
            # ---------------------------------------------------------------
            # OPTIONAL application-layer defense (DISABLED by default).
            #
            # `limit_rate` paces how fast NGINX feeds the socket, which
            # decouples the kernel's inflated cwnd from the actual send rate —
            # i.e. it is precisely a *defense* against the optimistic-ACK
            # attack. It is therefore left OFF here so the ATTACK scenario can
            # demonstrate its full effect; the primary defense under test is
            # the XDP/eBPF ACK filter (defense/). Re-enable these two lines to
            # evaluate the app-layer defense on its own.
            #
            #   limit_rate 2m;          # 2 MB/s ≈ 16 Mbps per connection
            #   limit_rate_after 1m;    # first 1 MB unrestricted, then cap
            # ---------------------------------------------------------------

            add_header X-CSE406-Defense "none";
        }

        # Health check endpoint for experiment scripts
        location /health {
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
    }
}
